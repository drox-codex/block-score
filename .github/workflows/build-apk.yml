name: Build BLOCK SCORE APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_FILE"
            if [ -s "$KEYSTORE_FILE" ]; then
              echo "Keystore decoded successfully ($(wc -c < "$KEYSTORE_FILE") bytes)."
            else
              echo "Warning: Decoded keystore was empty. Creating fallback keystore..."
              rm -f "$KEYSTORE_FILE"
            fi
          fi

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Generating valid release signing keystore fallback..."
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=BlockScore,O=DroxStudio,C=US"
          fi
          ls -lh "$KEYSTORE_FILE"

      - name: Ensure Environment Files
        run: |
          touch "$GITHUB_WORKSPACE/.env.example"
          touch "$GITHUB_WORKSPACE/.env"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCK-SCORE-Release-APK
          path: "app/build/outputs/apk/release/*.apk"
